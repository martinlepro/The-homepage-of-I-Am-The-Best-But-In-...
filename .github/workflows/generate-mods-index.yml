name: Generate mods index

on:
  push:
    branches:
      - main
    paths:
      - "mods/**"
      - "scripts/**"
      - ".github/workflows/generate-mods-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Générer l'index des mods
        run: node scripts/generate-mods-index.js

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mods-index.json
          git diff --cached --quiet || git commit -m "Mise à jour de l'index des mods"
          git push